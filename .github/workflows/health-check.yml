name: Health Check

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: health-check
  cancel-in-progress: false

env:
  PAGES_URL: https://wulfland.github.io/Repstack/

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest

    outputs:
      production_check: ${{ steps.production-check.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check production
        id: production-check
        continue-on-error: true
        run: |
          echo "Probing $PAGES_URL"
          curl -sf --max-time 20 "$PAGES_URL" -o /dev/null
          echo "HTTP probe OK"
          npx playwright test e2e/smoke.spec.ts
        env:
          BASE_URL: ${{ env.PAGES_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: steps.production-check.outcome == 'failure'
        with:
          name: health-check-report
          path: playwright-report/
          retention-days: 7

  alert:
    name: Open incident
    runs-on: ubuntu-latest
    needs: probe
    if: always() && needs.probe.outputs.production_check == 'failure'

    # actions: write lets the rollback step dispatch deploy.yml. Unlike most
    # events raised with the GITHUB_TOKEN, workflow_dispatch does start a run.
    permissions:
      contents: read
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Collect context from the deploy workflow
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh run list --workflow deploy.yml --branch main --limit 1 \
            --json databaseId,url,headSha,conclusion --jq '.[0] // {}')
          green=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 \
            --json databaseId,url,headSha --jq '.[0] // {}')

          source_sha() {
            local run_id=$1 fallback=$2 dir
            dir=$(mktemp -d)
            if [ -n "$run_id" ] && gh run download "$run_id" \
              --name deployment-source-sha --dir "$dir" >/dev/null 2>&1 \
              && [ -s "$dir/source-sha" ]; then
              tr -d '\r\n' < "$dir/source-sha"
            else
              printf '%s' "$fallback"
            fi
            rm -rf "$dir"
          }

          latest_sha=$(source_sha "$(jq -r '.databaseId // empty' <<<"$latest")" \
            "$(jq -r '.headSha // "n/a"' <<<"$latest")")
          green_sha=$(source_sha "$(jq -r '.databaseId // empty' <<<"$green")" \
            "$(jq -r '.headSha // "n/a"' <<<"$green")")
          {
            echo "deploy_url=$(jq -r '.url // "n/a"' <<<"$latest")"
            echo "deploy_sha=$latest_sha"
            echo "green_url=$(jq -r '.url // "n/a"' <<<"$green")"
            echo "green_sha=$green_sha"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Find the open incident
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create incident --color B60205 --force \
            --description "Production health check failed; agent task open"

          existing=$(gh issue list --label incident --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          echo "number=$existing" >> "$GITHUB_OUTPUT"

      # Restore service before anyone, human or agent, picks up the issue.
      # Only for a new incident: while one is open, a failing check means the
      # rollback is still deploying or did not help, and redeploying again
      # would not change that. Set the repository variable AUTO_ROLLBACK to
      # `false` to leave the rollback to a human.
      - name: Roll back to the last green commit
        id: rollback
        if: steps.open.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTO_ROLLBACK: ${{ vars.AUTO_ROLLBACK }}
          DEPLOY_SHA: ${{ steps.ctx.outputs.deploy_sha }}
          LAST_GREEN_SHA: ${{ steps.ctx.outputs.green_sha }}
          DISPATCH_RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml?query=event%3Aworkflow_dispatch
        run: |
          # The status ends up in the issue table via sed, so it must not
          # contain "|" or "&".
          report() {
            echo "status=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::Rollback: $1"
          }

          if [ "$AUTO_ROLLBACK" = "false" ]; then
            report "Not rolled back: automatic rollback is off (repository variable AUTO_ROLLBACK=false)."
          elif [ -z "$LAST_GREEN_SHA" ] || [ "$LAST_GREEN_SHA" = "n/a" ]; then
            report "Not rolled back: no green deploy of main was found."
          elif [ "$DEPLOY_SHA" = "$LAST_GREEN_SHA" ]; then
            report "Not rolled back: the deployed commit is already the last green one, so a redeploy would not help."
          elif gh workflow run deploy.yml --ref main -f ref="$LAST_GREEN_SHA"; then
            report "Started a redeploy of the last green commit \`$LAST_GREEN_SHA\` (deploy run: $DISPATCH_RUNS_URL). The next health checks show whether that restored service."
          else
            echo "::warning::Could not dispatch deploy.yml for $LAST_GREEN_SHA."
            report "Rollback failed: dispatching deploy.yml for \`$LAST_GREEN_SHA\` returned an error. A human must redeploy it."
          fi

      - name: Open or update the incident issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEALTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ steps.ctx.outputs.deploy_url }}
          DEPLOY_SHA: ${{ steps.ctx.outputs.deploy_sha }}
          LAST_GREEN_RUN_URL: ${{ steps.ctx.outputs.green_url }}
          LAST_GREEN_SHA: ${{ steps.ctx.outputs.green_sha }}
          ROLLBACK: ${{ steps.rollback.outputs.status }}
          DATE: ${{ steps.ctx.outputs.date }}
          EXISTING: ${{ steps.open.outputs.number }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "Incident issue #$EXISTING is already open; adding this run."
            gh issue comment "$EXISTING" --body \
              "Health check failed again: $HEALTH_RUN_URL (deployed commit \`$DEPLOY_SHA\`)."
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -e "s|{{HEALTH_RUN_URL}}|$HEALTH_RUN_URL|g" \
              -e "s|{{DEPLOY_RUN_URL}}|$DEPLOY_RUN_URL|g" \
              -e "s|{{DEPLOY_SHA}}|$DEPLOY_SHA|g" \
              -e "s|{{LAST_GREEN_RUN_URL}}|$LAST_GREEN_RUN_URL|g" \
              -e "s|{{LAST_GREEN_SHA}}|$LAST_GREEN_SHA|g" \
              -e "s|{{ROLLBACK}}|$ROLLBACK|g" \
              -e "s|{{DATE}}|$DATE|g" \
              .github/INCIDENT_TASK.md > /tmp/incident-body.md

          url=$(gh issue create \
            --title "Incident $DATE: production health check failed" \
            --label incident \
            --body-file /tmp/incident-body.md)
          echo "Opened $url"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Assigning Copilot starts the coding agent on the task above. The
      # GITHUB_TOKEN cannot assign Copilot on its own, so a fine-grained PAT
      # (Actions, Contents, Issues, Pull requests: read/write) of a user with
      # a Copilot seat is used when the COPILOT_ASSIGN_TOKEN secret exists.
      # Retry on existing issues, adding Copilot without replacing any human
      # assignees. GitHub requires the GraphQL-Features header for Copilot
      # assignment calls.
      - name: Ensure Copilot is assigned
        if: steps.issue.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          NUMBER: ${{ steps.issue.outputs.number }}
          FEATURES: 'GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection'
        run: |
          # shellcheck disable=SC2016  # $owner etc. are GraphQL variables, not shell
          copilot_id=$(gh api graphql -H "$FEATURES" \
            -F owner="$OWNER" -F name="$NAME" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
              }
            }' \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id' \
            2>/dev/null || true)

          if [ -z "$copilot_id" ]; then
            echo "::warning::Copilot is not assignable in this repository (coding agent off, or token lacks a Copilot seat). Issue #$NUMBER stays unassigned."
            exit 0
          fi

          issue_id=$(gh issue view "$NUMBER" --json id --jq .id)

          # shellcheck disable=SC2016  # GraphQL variables again
          # `actorIds[]=` makes gh send a JSON array; a quoted "[...]" would
          # arrive as one string and fail with NOT_FOUND.
          if gh api graphql -H "$FEATURES" \
            -F assignableId="$issue_id" -f "actorIds[]=$copilot_id" \
            -f query='mutation($assignableId: ID!, $actorIds: [ID!]!) {
              addAssigneesToAssignable(input: { assignableId: $assignableId, assigneeIds: $actorIds }) {
                assignable { ... on Issue { number assignees(first: 5) { nodes { login } } } }
              }
            }'; then
            echo "Issue #$NUMBER assigned to Copilot."
          else
            echo "::warning::Could not assign issue #$NUMBER to Copilot. Assign it by hand to start the agent."
          fi
